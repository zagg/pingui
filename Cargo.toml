[package]
name = "pingui"
version = "0.1.0"
edition = "2021"
description = "Ping graphique en terminal — un gping en mieux : ICMP natif, multi-vues, percentiles, jitter, export CSV/JSON"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
eframe = { version = "0.31", optional = true }
humantime = "2"
ratatui = "0.29"
socket2 = { version = "0.5", features = ["all"] }

[features]
default = ["gui"]
gui = ["dep:eframe"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
